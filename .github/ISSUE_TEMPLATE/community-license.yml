name: 申請社群授權檔 / Request a community license
description: 免費、效期 10 年。供 Gemba MES 使用。
title: "[License] "
labels: [license-request]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ 先看這裡

        請提供**環境指紋**（64 個十六進位字元），**不要**提供機器錨定碼
        （`instance-id` 檔的內容，長得像 UUID）。

        錨定碼同時是連線字串加密的金鑰材料，貼到公開 Issue 等於把它交出去。
        指紋是錨定碼的單向雜湊，貼出來是安全的——它本來就是要送給核發方的東西。

        取得指紋：

        ```bash
        dotnet run --project SmartFactory.MES.MachineId -- --init   # 首次
        dotnet run --project SmartFactory.MES.MachineId             # 顯示指紋
        ```

        沒有 .NET runtime 時：`bash tools/get-fingerprint.sh`

  - type: input
    id: fingerprint
    attributes:
      label: 環境指紋
      description: 64 個十六進位字元。一台機器一組；多台請一行一組列在下方備註。
      placeholder: 9B6A579ECD8E1570........................................
    validations: {required: true}

  - type: input
    id: name
    attributes:
      label: 名稱
      description: 會寫進授權檔的 clientName，只用於啟動時的日誌，填公司名或代號都可以。
    validations: {required: true}

  - type: dropdown
    id: purpose
    attributes:
      label: 用途
      options:
        - 評估測試
        - 自家生產使用
        - 替客戶導入（顧問）
        - 其他
    validations: {required: true}

  - type: textarea
    id: notes
    attributes:
      label: 備註（選填）
      description: 多台機器的指紋、或任何要說明的事。

  - type: checkboxes
    id: terms
    attributes:
      label: 確認
      options:
        - label: 我已閱讀 Gemba MES 的 LICENSING.md，了解 Elastic License 2.0 的三條限制
          required: true
        - label: 我提供的是環境指紋，不是機器錨定碼
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        簽章在本機離線完成，私鑰不上任何雲端，所以不是自動回覆——
        請給幾天時間。核發後會把 `license.json` 貼在本串。
